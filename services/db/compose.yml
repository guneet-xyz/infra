name: dev-db
services:
  postgres:
    container_name: dev-db-postgres
    hostname: dev-db
    image: postgres:17
    ports:
      - 100.100.2.1:5432:5432
    pull_policy: always
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - default
  pgui:
    container_name: dev-db-ui
    image: kvqn/pgui:latest
    pull_policy: always
    restart: always
    environment:
      DB_1_NAME: dev-db
      DB_1_HOST: postgres
      DB_1_PORT: 5432
      DB_1_USER: postgres
      DB_1_PASSWORD: password
      DB_1_SSL: false
    networks:
      - default
      - caddy-private
networks:
  default:
  caddy-private:
    external: true
