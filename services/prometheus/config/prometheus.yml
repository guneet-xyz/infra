global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
# alerting:
#   alertmanagers:
#   - static_configs:
#     - targets: []
#     sheme: http
#     timeout: 10s
#     api_version: v2
scrape_configs:
- job_name: prometheus
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - localhost:9090
- job_name: node_exporter
  static_configs:
  - targets:
    - thinkcentre:9100
    - gilgamesh:9100
- job_name: caddy
  static_configs:
  - targets:
    - private.caddy.guneet.xyz
    - public.caddy.guneet.xyz
    - self.caddy.guneet.xyz
