services:
  caddy:
    build:
      context: .
    container_name: caddy-public
    hostname: caddy-public
    restart: unless-stopped
    ports:
      - 172.16.0.4:80:80 # public
      - 172.16.0.4:443:443 # public
      - 172.16.0.4:443:443/udp # public
    networks:
      - caddy-public
      - caddy-private
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
  tailscale:
    image: tailscale/tailscale:latest
    pull_policy: always
    container_name: caddy-public-ts
    restart: always
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_AUTHKEY: ${TS_AUTHKEY}
    volumes:
      - ./tailscale:/var/lib/tailscale
    network_mode: service:caddy
networks:
  caddy-public:
    external: true
  caddy-private:
    external: true
