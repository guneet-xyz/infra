# Shared values for cross-app references and common config.
#
# Usage: helm install -f values-shared.yaml -f apps/<chart>/values.yaml ...

apps:
  caddy:
    appName: caddy
    namespace: caddy
  walls:
    appName: walls
    namespace: walls
    port: 3000
  headlamp:
    appName: headlamp
    namespace: headlamp
    port: 80
  litellm:
    appName: litellm
    namespace: litellm
    port: 4000
  openwebui:
    appName: openwebui
    namespace: openwebui
    port: 8080
  infisical:
    appName: infisical
    namespace: infisical
    port: 8080
  portainer:
    appName: portainer
    namespace: portainer
    port: 9000
  demo:
    appName: demo
    namespace: demo
    port: 80
  demoFallback:
    appName: demo-fallback
    namespace: demo
    port: 80
  homepage:
    appName: homepage
    namespace: homepage
    port: 3000
  tailscale:
    appName: tailscale-operator
    namespace: tailscale
  registry:
    appName: registry
    namespace: registry
    port: 5000
  registryUi:
    appName: registry-ui
    namespace: registry
    port: 3000

smtp:
  host: smtp.azurecomm.net
  port: "587"
  mailFrom: donotreply@guneet.xyz
