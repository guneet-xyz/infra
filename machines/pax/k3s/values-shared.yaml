# Shared values for cross-app references and common config.
#
# Usage: helm install -f values-shared.yaml -f apps/<chart>/values.yaml ...

apps:
  caddy:
    appName: caddy
    namespace: caddy
  walls:
    appName: walls
    namespace: walls
    port: 3000
  headlamp:
    appName: headlamp
    namespace: headlamp
    port: 80
  litellm:
    appName: litellm
    namespace: litellm
    port: 4000

smtp:
  host: smtp.azurecomm.net
  port: "587"
  mailFrom: noreply@guneet.xyz
