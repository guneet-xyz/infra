{{ include "platform.networkpolicy.defaultDeny" (dict "app" .Values.apps.walls) }}
---
{{ include "platform.networkpolicy.allowFromCaddy" (dict "app" .Values.apps.walls "caddy" .Values.apps.caddy) }}
---
# Allow walls app to reach its Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Values.apps.walls.namespace }}
  labels:
    app: {{ .Values.apps.walls.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.walls.postgres.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.apps.walls.appName }}
      ports:
        - port: {{ .Values.apps.walls.postgres.port }}
          protocol: TCP
