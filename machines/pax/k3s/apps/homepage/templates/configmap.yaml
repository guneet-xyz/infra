apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apps.homepage.configMaps.config }}
  namespace: {{ .Values.apps.homepage.namespace }}
  labels:
    app: {{ .Values.apps.homepage.appName }}
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: homepage
    favicon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
    hideVersion: true
    color: slate
  services.yaml: |
    - Apps:
        - Walls:
            icon: https://walls.guneet.dev/favicon.ico
            href: https://walls.guneet.dev
            description: Custom application
        - LiteLLM:
            icon: si-openai
            href: https://llm.guneet.dev
            description: LLM proxy/gateway
        - Open WebUI:
            icon: si-openai
            href: https://chat.guneet.xyz
            description: Chat UI for LLMs
        - Infisical:
            icon: https://infisical.guneet.dev/favicon.ico
            href: https://infisical.guneet.dev
            description: Secrets management
    - Cluster Management:
        - Headlamp:
            icon: si-kubernetes
            href: https://headlamp.guneet.xyz
            description: Kubernetes dashboard
        - Portainer:
            icon: si-portainer
            href: https://portainer.guneet.xyz
            description: Container management
        - Registry:
            icon: si-docker
            href: https://cr.guneet.xyz
            description: Container image registry
        - Homepage:
            icon: si-homepage
            href: https://home.guneet.xyz
            description: This dashboard
    - Kubernetes:
        - Cluster:
            widget:
              type: portainer
              url: http://portainer.portainer.svc.cluster.local:9000
              env: 1
              kubernetes: true
              key: __HOMEPAGE_PORTAINER_TOKEN__
  bookmarks.yaml: |
    - Infra Management:
        - Cloudflare Dashboard:
            - icon: si-cloudflare
              href: https://dash.cloudflare.com
        - Tailscale Admin:
            - icon: si-tailscale
              href: https://login.tailscale.com/admin
    - GitHub:
        - infra:
            - icon: si-github
              href: https://github.com/guneet-xyz/infra
        - opencode-vault:
            - icon: si-github
              href: https://github.com/guneet-xyz/opencode-vault
    - Tools:
        - GitHub:
            - icon: si-github
              href: https://github.com
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
