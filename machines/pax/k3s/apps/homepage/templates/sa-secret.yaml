apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ .Values.apps.homepage.appName }}-sa-token
  namespace: {{ .Values.apps.homepage.namespace }}
  labels:
    app: {{ .Values.apps.homepage.appName }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.apps.homepage.appName }}
