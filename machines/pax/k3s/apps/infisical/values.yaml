apps:
  infisical:
    images:
      infisical:
        image: infisical/infisical
        imageTag: latest
      redis:
        image: redis
        imageTag: latest
      postgres:
        image: postgres
        imageTag: "17.9-alpine"

    replicas: 1

    domain: infisical.guneet.dev
    smtpFromName: Infisical

    postgres:
      serviceName: infisical-postgres
      port: 5432
      dbName: infisical
      dbUser: infisical
      dbPassword: __INFISICAL_POSTGRES_PASSWORD__
      storage: 1Gi

    redis:
      serviceName: infisical-redis
      port: 6379

    claims:
      postgresData: infisical-postgres-data
