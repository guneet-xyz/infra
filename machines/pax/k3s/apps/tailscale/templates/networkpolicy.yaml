# Default deny all ingress — operator only makes outbound calls
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.apps.tailscale.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Portainer to reach the subnet router connector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-portainer
  namespace: {{ .Values.apps.tailscale.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.portainer.namespace }}
