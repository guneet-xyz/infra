apps:
  devDb:
    images:
      pgui:
        image: kvqn/pgui
        imageTag: "latest"
      postgres:
        image: postgres
        imageTag: "17.9-alpine"

    replicas: 1

    domain: db.guneet.xyz

    postgres:
      serviceName: dev-db-postgres
      port: 5432
      dbName: dev-db
      dbUser: postgres
      dbPassword: postgres
      storage: 5Gi

    claims:
      postgresData: dev-db-postgres-data
