{{ include "platform.networkpolicy.defaultDeny" (dict "app" .Values.apps.devDb) }}
---
{{ include "platform.networkpolicy.allowFromCaddy" (dict "app" .Values.apps.devDb "caddy" .Values.apps.caddy) }}
---
# Allow caddy -> postgres (layer4 raw TCP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-caddy-to-postgres
  namespace: {{ .Values.apps.devDb.namespace }}
  labels:
    app: {{ .Values.apps.devDb.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.devDb.postgres.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.caddy.namespace }}
      ports:
        - port: {{ .Values.apps.devDb.postgres.port }}
          protocol: TCP
---
# Allow pgui -> postgres (same namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgui-to-postgres
  namespace: {{ .Values.apps.devDb.namespace }}
  labels:
    app: {{ .Values.apps.devDb.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.devDb.postgres.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.apps.devDb.appName }}
      ports:
        - port: {{ .Values.apps.devDb.postgres.port }}
          protocol: TCP
