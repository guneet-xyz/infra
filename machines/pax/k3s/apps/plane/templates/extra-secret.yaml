# NOTE: Plane CE's upstream chart (plane-ce@1.5.1) already creates comprehensive Secret resources
# from its values.yaml configuration in templates/config-secrets/:
#   - app-env.yaml          → SECRET_KEY, LIVE_SERVER_SECRET_KEY, database/redis/rabbitmq/minio URLs
#   - pgdb.yaml             → postgres credentials
#   - rabbitmqdb.yaml       → RabbitMQ credentials
#   - docker-registry.yaml  → registry credentials
#   - doc-store.yaml        → minio/S3 credentials
#   - live-env.yaml         → WebSocket/live server config
#
# Obscuro substitution (via .obscuro/secrets.json) replaces placeholders at apply time:
#   Required tokens: PLANE_SECRET_KEY, PLANE_LIVE_SERVER_SECRET_KEY, PLANE_POSTGRES_PASSWORD,
#                    PLANE_RABBITMQ_PASSWORD, PLANE_MINIO_ROOT_PASSWORD
#
# This file is intentionally minimal and contains no actual Secret resource.
# All environment variables needed by Plane are already handled by the upstream chart.
