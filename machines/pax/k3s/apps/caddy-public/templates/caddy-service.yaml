apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apps.caddyPublic.appName }}
  namespace: {{ .Values.apps.caddyPublic.namespace }}
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: 443-udp
      port: 443
      protocol: UDP
      targetPort: 443
  selector:
    app: {{ .Values.apps.caddyPublic.appName }}
