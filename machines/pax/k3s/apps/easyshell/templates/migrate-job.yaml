apiVersion: batch/v1
kind: Job
metadata:
  name: easyshell-migrate
  namespace: {{ .Values.apps.easyshell.namespace }}
  labels:
    app: {{ .Values.apps.easyshell.appName }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Values.apps.easyshell.appName }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: default
      nodeSelector:
        role: primary
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: migrate
          image: {{ .Values.apps.easyshell.migrator.image }}:{{ .Values.apps.easyshell.migrator.imageTag }}
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coordinator-secret
                  key: DATABASE_URL
