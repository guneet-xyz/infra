# This PVC is ReadWriteOnce and shared by both caddy-public and caddy-private.
# This works because all pods are pinned to the same node via nodeSelector.
# If node pinning is ever removed, this must be changed to ReadWriteMany or
# split into separate PVCs per variant.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.apps.caddy.claims.data }}
  namespace: {{ .Values.apps.caddy.namespace }}
  labels:
    app: {{ .Values.apps.caddy.appName }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.apps.caddy.storage }}
