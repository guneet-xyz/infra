{{- range $variant := list "public" "private" }}
{{- $variantValues := index $.Values.apps.caddy $variant }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.apps.caddy.appName }}-{{ $variant }}
  namespace: {{ $.Values.apps.caddy.namespace }}
  labels:
    app: {{ $.Values.apps.caddy.appName }}-{{ $variant }}
spec:
  type: ClusterIP
  externalIPs:
    - {{ $variantValues.externalIP }}
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: https-udp
      port: 443
      protocol: UDP
      targetPort: 443
  selector:
    app: {{ $.Values.apps.caddy.appName }}-{{ $variant }}
{{- end }}
