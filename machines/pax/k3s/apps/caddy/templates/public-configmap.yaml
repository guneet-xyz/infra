apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apps.caddy.public.configMaps.caddyfile }}
  namespace: {{ .Values.apps.caddy.namespace }}
  labels:
    app: {{ .Values.apps.caddy.appName }}
data:
  Caddyfile: |
    {
    	email guneetaggarwal@gmail.com
    	acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}
    }
    
    :80 {
    	respond /healthz 200
    }
    
    walls.guneet.dev {
    	reverse_proxy {{ .Values.apps.walls.appName }}.{{ .Values.apps.walls.namespace }}.svc.cluster.local:{{ .Values.apps.walls.port }}
    }
    
    easyshell.sh {
    	reverse_proxy {{ .Values.apps.easyshell.appName }}.{{ .Values.apps.easyshell.namespace }}.svc.cluster.local:{{ .Values.apps.easyshell.port }}
    }
    
    infisical.guneet.dev {
    	reverse_proxy {{ .Values.apps.infisical.appName }}.{{ .Values.apps.infisical.namespace }}.svc.cluster.local:{{ .Values.apps.infisical.port }}
    }
    
    demo.guneet.dev {
    	handle_errors 502 {
    		reverse_proxy {{ .Values.apps.demoFallback.appName }}.{{ .Values.apps.demoFallback.namespace }}.svc.cluster.local:{{ .Values.apps.demoFallback.port }}
    	}
    	reverse_proxy {{ .Values.apps.demo.appName }}.{{ .Values.apps.demo.namespace }}.svc.cluster.local:{{ .Values.apps.demo.port }}
    }

    cr.guneet.dev {
    	@favicon path /favicon.ico
    	header @favicon Content-Type image/svg+xml
    	respond @favicon `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f172a"/><path d="M18 22 32 14l14 8v20l-14 8-14-8z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/><path d="M18 22 32 30l14-8M32 30v20" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>` 200

    	@write {
    		path /v2/*
    		method POST PUT PATCH DELETE
    	}
    	basic_auth @write {
    		{env.REGISTRY_PUBLIC_USERNAME} {env.REGISTRY_PUBLIC_HTPASSWD}
    	}

    	reverse_proxy /v2/* {{ .Values.apps.registryPublic.appName }}.{{ .Values.apps.registryPublic.namespace }}.svc.cluster.local:{{ .Values.apps.registryPublic.port }} {
    		flush_interval -1
    		transport http {
    			read_timeout 10m
    			write_timeout 10m
    		}
    	}

    	request_body {
    		max_size 0
    	}

    	reverse_proxy {{ .Values.apps.registryPublicUi.appName }}.{{ .Values.apps.registryPublicUi.namespace }}.svc.cluster.local:{{ .Values.apps.registryPublicUi.port }}
    }

    books.guneet.dev {
    	reverse_proxy https://books.guneet.xyz {
    		header_up Host {upstream_hostport}
    	}
    }

    abs.guneet.dev {
    	reverse_proxy https://abs.guneet.xyz {
    		header_up Host {upstream_hostport}
    	}
    }

    matrix.guneet.dev {
    	handle /.well-known/matrix/server {
    		header Content-Type application/json
    		header Access-Control-Allow-Origin *
    		respond `{"m.server": "matrix.guneet.dev:443"}` 200
    	}
    	handle /.well-known/matrix/client {
    		header Content-Type application/json
    		header Access-Control-Allow-Origin *
    		respond `{"m.homeserver": {"base_url": "https://matrix.guneet.dev"}}` 200
    	}
    	handle {
    		request_body {
    			max_size 100MB
    		}
    		reverse_proxy {{ .Values.apps.synapse.appName }}.{{ .Values.apps.synapse.namespace }}.svc.cluster.local:{{ .Values.apps.synapse.port }}
    	}
    }

    chat.guneet.dev {
    	reverse_proxy {{ .Values.apps.element.appName }}.{{ .Values.apps.element.namespace }}.svc.cluster.local:{{ .Values.apps.element.port }}
    }

    turn.matrix.guneet.dev {
    	respond 404
    }
