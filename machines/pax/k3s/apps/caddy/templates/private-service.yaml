apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apps.caddy.appName }}-private
  namespace: {{ .Values.apps.caddy.namespace }}
  labels:
    app: {{ .Values.apps.caddy.appName }}-private
spec:
  type: ClusterIP
  externalIPs:
    - {{ .Values.apps.caddy.private.externalIP }}
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: https-udp
      port: 443
      protocol: UDP
      targetPort: 443
  selector:
    app: {{ .Values.apps.caddy.appName }}-private
