{{ include "platform.networkpolicy.defaultDeny" (dict "app" .Values.apps.registryPublic) }}
---
# Allow Caddy to reach registry and UI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-caddy
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublic.appName }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.caddy.namespace }}
      ports:
        - port: {{ .Values.apps.registryPublic.port }}
          protocol: TCP
        - port: {{ .Values.apps.registryPublicUi.port }}
          protocol: TCP
---
# Allow Registry UI to reach the internal read-only Registry API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-to-registry-public-ui-api
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublic.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.registryPublicUiApi.appName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.apps.registryPublicUi.appName }}
      ports:
        - port: {{ .Values.apps.registryPublicUiApi.port }}
          protocol: TCP
