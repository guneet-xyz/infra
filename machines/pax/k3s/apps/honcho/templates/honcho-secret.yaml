apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
type: Opaque
stringData:
  # Database — env prefix DB_, MUST use postgresql+psycopg:// prefix (SQLAlchemy psycopg3 driver)
  DB_CONNECTION_URI: postgresql+psycopg://{{ .Values.apps.honcho.postgres.dbUser }}:{{ .Values.apps.honcho.postgres.dbPassword }}@{{ .Values.apps.honcho.postgres.serviceName }}:{{ .Values.apps.honcho.postgres.port }}/{{ .Values.apps.honcho.postgres.dbName }}
  # Cache (Redis) — env prefix CACHE_
  CACHE_ENABLED: "true"
  CACHE_URL: redis://{{ .Values.apps.honcho.redis.serviceName }}:{{ .Values.apps.honcho.redis.port }}/0
  # LLM — env prefix LLM_, route through litellm
  LLM_OPENAI_API_KEY: __LITELLM_MASTER_KEY__
  LLM_OPENAI_BASE_URL: http://{{ .Values.apps.litellm.appName }}.{{ .Values.apps.litellm.namespace }}.svc.cluster.local:{{ .Values.apps.litellm.port }}
  # Honcho v3 defaults to gpt-5.4-mini, but this cluster's LiteLLM
  # exposes gpt-5.4/gpt-5.5. Pin all reasoning workers to a routed model.
  DERIVER_MODEL_CONFIG__TRANSPORT: openai
  DERIVER_MODEL_CONFIG__MODEL: gpt-5.4
  SUMMARY_MODEL_CONFIG__TRANSPORT: openai
  SUMMARY_MODEL_CONFIG__MODEL: gpt-5.4
  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: openai
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: gpt-5.4
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: openai
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__minimal__MAX_TOOL_ITERATIONS: "1"
  DIALECTIC_LEVELS__minimal__TOOL_CHOICE: none
  DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__low__MAX_TOOL_ITERATIONS: "1"
  DIALECTIC_LEVELS__low__TOOL_CHOICE: none
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__medium__MAX_TOOL_ITERATIONS: "1"
  DIALECTIC_LEVELS__medium__TOOL_CHOICE: none
  DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__high__MAX_TOOL_ITERATIONS: "1"
  DIALECTIC_LEVELS__high__TOOL_CHOICE: none
  DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT: openai
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: gpt-5.4
  DIALECTIC_LEVELS__max__MAX_TOOL_ITERATIONS: "1"
  DIALECTIC_LEVELS__max__TOOL_CHOICE: none
  # LiteLLM exposes text-embedding-3-small as an alias for the GitHub Models
  # text-embedding-3-large backend, so Honcho can perform semantic prefetch and
  # message embedding through the same OpenAI-compatible LiteLLM endpoint.
  EMBED_MESSAGES: "true"
  # Auth disabled — tailscale-only isolation (env prefix AUTH_)
  AUTH_USE_AUTH: "false"
