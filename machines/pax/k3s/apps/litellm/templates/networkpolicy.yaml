{{ include "platform.networkpolicy.defaultDeny" (dict "app" .Values.apps.litellm) }}
---
# Allow private Caddy to reach LiteLLM (tailscale-only route)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-caddy
  namespace: {{ .Values.apps.litellm.namespace }}
  labels:
    app: {{ .Values.apps.litellm.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.litellm.appName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.caddy.namespace }}
          podSelector:
            matchLabels:
              app: {{ printf "%s-private" .Values.apps.caddy.appName | quote }}
      ports:
        - port: {{ .Values.apps.litellm.port }}
          protocol: TCP
---
{{ include "platform.networkpolicy.allowFromNamespace" (dict "app" .Values.apps.litellm "sourceNamespace" .Values.apps.openwebui.namespace "name" "allow-from-openwebui") }}
---
{{ include "platform.networkpolicy.allowFromNamespace" (dict "app" .Values.apps.litellm "sourceNamespace" .Values.apps.honcho.namespace "name" "allow-from-honcho") }}
---
# Allow LiteLLM app to reach its Postgres (intra-namespace; library has no define for postgres-targeting NPs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Values.apps.litellm.namespace }}
  labels:
    app: {{ .Values.apps.litellm.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.litellm.postgres.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.apps.litellm.appName }}
      ports:
        - port: {{ .Values.apps.litellm.postgres.port }}
          protocol: TCP
