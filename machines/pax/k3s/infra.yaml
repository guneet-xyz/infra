apiVersion: easyinfra/v2
cluster:
  name: k3s
  type: k3s
  kubeContext: k3s
defaults:
  valueFiles: [values-shared.yaml]
phases:
  - name: core
    apps: [caddy, registry]
  - name: workloads
    apps: [demo, headlamp, homepage, infisical, litellm, openwebui, portainer, tailscale, walls]
apps:
  # discovered at: apps/caddy
  - name: caddy
    chart: apps/caddy
    namespace: caddy
  # discovered at: apps/demo
  - name: demo
    chart: apps/demo
    namespace: demo
  # discovered at: apps/headlamp
  - name: headlamp
    chart: apps/headlamp
    namespace: headlamp
  # discovered at: apps/homepage
  - name: homepage
    chart: apps/homepage
    namespace: homepage
  # discovered at: apps/infisical
  - name: infisical
    chart: apps/infisical
    namespace: infisical
  # discovered at: apps/litellm
  - name: litellm
    chart: apps/litellm
    namespace: litellm
  # discovered at: apps/openwebui
  - name: openwebui
    chart: apps/openwebui
    namespace: openwebui
  # discovered at: apps/portainer
  - name: portainer
    chart: apps/portainer
    namespace: portainer
  # discovered at: apps/registry
  - name: registry
    chart: apps/registry
    namespace: registry
  # discovered at: apps/tailscale
  - name: tailscale
    chart: apps/tailscale
    namespace: tailscale
  # discovered at: apps/walls
  - name: walls
    chart: apps/walls
    namespace: walls
    dependsOn: [caddy, registry]
