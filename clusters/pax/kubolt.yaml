apiVersion: kubolt.io/v1
apps:
  - name: caddy
    chartPath: ./apps/caddy
    namespace: caddy
    backup:
      targets:
        - type: filesystem
          pvc: caddy-data
      scaleDeployments: true

  - name: registry
    chartPath: ./apps/registry
    namespace: registry
    dependsOn: [caddy]
    backup:
      targets:
        - type: filesystem
          pvc: registry-data
      scaleDeployments: true

  - name: walls
    chartPath: ./apps/walls
    namespace: walls
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: pg_dump
          podSelector: app=walls-postgres
      scaleDeployments: true

  - name: litellm
    chartPath: ./apps/litellm
    namespace: litellm
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: filesystem
          pvc: litellm-data
        - type: pg_dump
          podSelector: app=litellm-postgres
      scaleDeployments: true

  - name: openwebui
    chartPath: ./apps/openwebui
    namespace: openwebui
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: filesystem
          pvc: openwebui-data
      scaleDeployments: true

  - name: infisical
    chartPath: ./apps/infisical
    namespace: infisical
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: pg_dump
          podSelector: app=infisical-postgres
      scaleDeployments: true

  - name: dev-db
    chartPath: ./apps/dev-db
    namespace: dev-db
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: pg_dump
          podSelector: app=dev-db-postgres
      scaleDeployments: true

  - name: honcho
    chartPath: ./apps/honcho
    namespace: honcho
    dependsOn: [caddy, registry]
    backup:
      targets:
        - type: pg_dump
          podSelector: app=honcho-postgres
      scaleDeployments: true

  - name: headlamp
    chartPath: ./apps/headlamp
    namespace: headlamp
    dependsOn: [caddy, registry]

  - name: homepage
    chartPath: ./apps/homepage
    namespace: homepage
    dependsOn: [caddy, registry]

  - name: portainer
    chartPath: ./apps/portainer
    namespace: portainer
    dependsOn: [caddy, registry]

  - name: demo
    chartPath: ./apps/demo
    namespace: demo
    dependsOn: [caddy, registry]

  - name: tailscale
    chartPath: ./apps/tailscale
    namespace: tailscale
    dependsOn: [caddy, registry]

  - name: registry-public
    chartPath: ./apps/registry-public
    namespace: registry-public
    dependsOn: [caddy]
    backup:
      targets:
        - type: filesystem
          pvc: registry-public-data
      scaleDeployments: true
