# Shared values for cross-app references and common config.
#
# Usage: helm install -f values-shared.yaml -f apps/<chart>/values.yaml ...

apps:
  caddy:
    appName: caddy
    namespace: caddy
  walls:
    appName: walls
    namespace: walls
    port: 3000
  headlamp:
    appName: headlamp
    namespace: headlamp
    port: 80
  litellm:
    appName: litellm
    namespace: litellm
    port: 4000
  openwebui:
    appName: openwebui
    namespace: openwebui
    port: 8080
  infisical:
    appName: infisical
    namespace: infisical
    port: 8080
  portainer:
    appName: portainer
    namespace: portainer
    port: 9000
  demo:
    appName: demo
    namespace: demo
    port: 80
  demoFallback:
    appName: demo-fallback
    namespace: demo
    port: 80
  devDb:
    appName: dev-db
    namespace: dev-db
    port: 3000
    postgresPort: 5432 # raw TCP for caddy-private layer4
  homepage:
    appName: homepage
    namespace: homepage
    port: 3000
  honcho:
    appName: honcho
    namespace: honcho
    port: 8000
  tailscale:
    appName: tailscale-operator
    namespace: tailscale
  registry:
    appName: registry
    namespace: registry
    port: 5000
  registryUi:
    appName: registry-ui
    namespace: registry
    port: 3000
  registryPublic:
    appName: registry-public
    namespace: registry-public
    port: 5000
    authAppName: registry-public-auth
    authPort: 5001
  registryPublicUi:
    appName: registry-public-ui
    namespace: registry-public
    port: 3000
  registryPublicUiApi:
    appName: registry-public-ui-api
    namespace: registry-public
    port: 5000
  plane:
    appName: plane
    namespace: plane
    domain: plane.guneet.xyz
    services:
      web:
        name: plane-web
        port: 3000
      space:
        name: plane-space
        port: 3000
      admin:
        name: plane-admin
        port: 3000
      api:
        name: plane-api
        port: 8000
      live:
        name: plane-live
        port: 3000
      minio:
        name: plane-minio
        port: 9000
  synapse:
    appName: synapse
    namespace: synapse
    port: 8008
    domain: matrix.guneet.dev
  element:
    appName: element
    namespace: synapse
    port: 80
    domain: chat.guneet.dev
  coturn:
    appName: coturn
    namespace: coturn

smtp:
  host: smtp.azurecomm.net
  port: "587"
  mailFrom: donotreply@guneet.xyz
