apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apps.infisical.appName }}
  namespace: {{ .Values.apps.infisical.namespace }}
  labels:
    app: {{ .Values.apps.infisical.appName }}
spec:
  replicas: {{ .Values.apps.infisical.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.apps.infisical.appName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ .Values.apps.infisical.appName }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/infisical-secret.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        role: primary
      containers:
        - name: infisical
          image: {{ .Values.apps.infisical.images.infisical.image }}:{{ .Values.apps.infisical.images.infisical.imageTag }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: {{ .Values.apps.infisical.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: app-secret
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.apps.infisical.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.apps.infisical.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
