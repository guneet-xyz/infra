apps:
  registryPublic:
    images:
      registry:
        image: registry
        imageTag: "3"
      ui:
        image: kvqn/crui
        imageTag: "0.7.0"

    replicas: 1

    domain: cr.guneet.dev

    storage: 10Gi

    claims:
      data: registry-public-data

    configMaps:
      registryConfig: registry-public-config
      uiApiConfig: registry-public-ui-api-config

    secrets:
      ui: registry-public-ui-secret

    gc:
      schedule: "0 4 * * 0"
