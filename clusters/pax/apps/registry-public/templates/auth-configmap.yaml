apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apps.registryPublic.configMaps.authConfig }}
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublic.authAppName }}
data:
  # cesanta/docker_auth v1 configuration.
  #
  # Goals:
  #   * Anonymous (no Authorization header) → token with catalog and pull access.
  #   * Authenticated users (Basic auth) → token with read-only access.
  #
  # cesanta/docker_auth needs an anonymous user entry to mint read-only tokens
  # for public Docker clients.
  auth_config.yml: |
    server:
      addr: ":{{ .Values.apps.registryPublic.authPort }}"

    token:
      issuer: "{{ .Values.apps.registryPublic.domain }}"
      expiration: 900
      certificate: "/certs/tls.crt"
      key: "/certs/tls.key"

    users:
      "": {}

    acl:
      - match: {account: "", type: "registry", name: "catalog"}
        actions: ["*"]
        comment: "Anonymous catalog listing"
      - match: {account: ""}
        actions: ["pull"]
        comment: "Anonymous pull"
