apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apps.registryPublic.configMaps.uiApiConfig }}
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublicUiApi.appName }}
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      maintenance:
        readonly:
          enabled: true
    http:
      addr: :{{ .Values.apps.registryPublicUiApi.port }}
      headers:
        X-Content-Type-Options: [nosniff]
