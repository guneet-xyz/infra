apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apps.registryPublic.appName }}
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublic.appName }}
spec:
  ports:
    - name: http
      port: {{ .Values.apps.registryPublic.port }}
      targetPort: {{ .Values.apps.registryPublic.port }}
  selector:
    app: {{ .Values.apps.registryPublic.appName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apps.registryPublic.authAppName }}
  namespace: {{ .Values.apps.registryPublic.namespace }}
  labels:
    app: {{ .Values.apps.registryPublic.authAppName }}
spec:
  ports:
    - name: http
      port: {{ .Values.apps.registryPublic.authPort }}
      targetPort: {{ .Values.apps.registryPublic.authPort }}
  selector:
    app: {{ .Values.apps.registryPublic.authAppName }}
