# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.apps.openwebui.namespace }}
  labels:
    app: {{ .Values.apps.openwebui.appName }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Caddy to reach Open WebUI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-caddy
  namespace: {{ .Values.apps.openwebui.namespace }}
  labels:
    app: {{ .Values.apps.openwebui.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.openwebui.appName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.caddy.namespace }}
      ports:
        - port: {{ .Values.apps.openwebui.port }}
          protocol: TCP
