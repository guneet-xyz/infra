# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Caddy-private to reach Honcho API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-caddy
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.honcho.appName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.caddy.namespace }}
      ports:
        - port: {{ .Values.apps.honcho.port }}
          protocol: TCP
---
# Allow honcho-deriver to reach honcho api (initContainer health check + runtime)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deriver-to-api
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.honcho.appName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.apps.honcho.appName }}-deriver
      ports:
        - port: {{ .Values.apps.honcho.port }}
          protocol: TCP
---
# Allow honcho api + deriver to reach postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.honcho.postgres.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - {{ .Values.apps.honcho.appName }}
                  - {{ .Values.apps.honcho.appName }}-deriver
      ports:
        - port: {{ .Values.apps.honcho.postgres.port }}
          protocol: TCP
---
# Allow honcho api + deriver to reach redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: {{ .Values.apps.honcho.namespace }}
  labels:
    app: {{ .Values.apps.honcho.appName }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.apps.honcho.redis.serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - {{ .Values.apps.honcho.appName }}
                  - {{ .Values.apps.honcho.appName }}-deriver
      ports:
        - port: {{ .Values.apps.honcho.redis.port }}
          protocol: TCP
