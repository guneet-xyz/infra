apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apps.litellm.configMaps.config }}
  namespace: {{ .Values.apps.litellm.namespace }}
  labels:
    app: {{ .Values.apps.litellm.appName }}
data:
  config.yml: |
    model_list:
    - model_name: claude-opus-4.5
      litellm_params:
        model: github_copilot/claude-opus-4.5
      model_info:
        supports_vision: True
    - model_name: claude-opus-4.6
      litellm_params:
        model: github_copilot/claude-opus-4.6
      model_info:
        supports_vision: True
    - model_name: claude-opus-4.7
      litellm_params:
        model: github_copilot/claude-opus-4.7
      model_info:
        supports_vision: True
    - model_name: claude-opus-4.6-1m
      litellm_params:
        model: github_copilot/claude-opus-4.6-1m
      model_info:
        supports_vision: True
    - model_name: claude-sonnet-4.6
      litellm_params:
        model: github_copilot/claude-sonnet-4.6
      model_info:
        supports_vision: True
    - model_name: claude-haiku-4.5
      litellm_params:
        model: github_copilot/claude-haiku-4.5
      model_info:
        supports_vision: True
    - model_name: gpt-5.4
      litellm_params:
        model: github_copilot/gpt-5.4
      model_info:
        supports_vision: True
        base_model: openai/gpt-5.4
    - model_name: gpt-5.5
      litellm_params:
        model: github_copilot/gpt-5.5
      model_info:
        supports_vision: True
        base_model: openai/gpt-5.5
    - model_name: text-embedding-3-large
      litellm_params:
        model: openai/text-embedding-3-large
        api_base: https://models.github.ai/inference
        api_key: os.environ/GITHUB_MODELS_API_KEY
      model_info:
        mode: embedding
        base_model: openai/text-embedding-3-large
    - model_name: text-embedding-3-small
      litellm_params:
        model: openai/text-embedding-3-large
        api_base: https://models.github.ai/inference
        api_key: os.environ/GITHUB_MODELS_API_KEY
      model_info:
        mode: embedding
        base_model: openai/text-embedding-3-large


    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      callbacks: ["smtp_email"]
      drop_params: true
